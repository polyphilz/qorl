target-version = "py312"
line-length = 88
src = ["src", "training/src"]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
    "N",
    "PTH",
    "PLR2004",
]
ignore = ["E501"]

[lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]

[lint.isort]
known-first-party = ["qorl", "qorl_training", "scripts"]

[format]
docstring-code-format = true
