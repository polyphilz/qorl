# QPRL PostgreSQL configuration
#
# Keep this file intentionally small. These settings define experiment
# semantics or remove background mutations. Capacity and planner settings such
# as shared_buffers, effective_cache_size, work_mem, cost constants, and
# parallel-worker limits must be frozen later with the worker topology and
# recorded in the database snapshot manifest.

shared_preload_libraries = 'pg_hint_plan'

# The benchmark snapshot is constructed explicitly and then treated as
# immutable. Background vacuum/analyze would otherwise change pages and
# statistics while measurements are running.
autovacuum = off

# Stable timestamps in logs and machine-readable artifacts.
timezone = 'UTC'
log_timezone = 'UTC'
log_line_prefix = '%m [%p] '

# Preserve PostgreSQL's durable defaults. Disabling these can make a benchmark
# look faster while making worker recovery and snapshot provenance unreliable.
fsync = on
full_page_writes = on
synchronous_commit = on

# New role passwords created by the bootstrap script use SCRAM.
password_encryption = 'scram-sha-256'
