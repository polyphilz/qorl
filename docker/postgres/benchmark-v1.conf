# QPRL benchmark-v1 PostgreSQL configuration
#
# The primary baseline deliberately retains PostgreSQL 16.15's stock planner,
# cost, memory, and parallel-query behavior. Defaults are written explicitly so
# a version change cannot silently change the experiment. Departures from stock
# behavior are limited to extension loading and measurement controls, and are
# recorded in benchmark-v1.expected.json.

qprl.benchmark_config_id = 'benchmark-v1'

# Extension
shared_preload_libraries = 'pg_hint_plan'

pg_hint_plan.enable_hint = on
pg_hint_plan.enable_hint_table = off
pg_hint_plan.hints_anywhere = off
pg_hint_plan.debug_print = off
pg_hint_plan.message_level = 'log'
pg_hint_plan.parse_messages = 'info'

# Immutable benchmark fixture
autovacuum = off

# No subscriptions exist in this benchmark. Removing the idle logical-
# replication launcher leaves all eight worker slots available to a single
# parallel query.
max_logical_replication_workers = 0

# Avoid host-dependent changes if explicit huge pages are provisioned later.
huge_pages = off
dynamic_shared_memory_type = 'posix'

# Stock PostgreSQL memory settings
shared_buffers = '128MB'
effective_cache_size = '4GB'
work_mem = '4MB'
hash_mem_multiplier = 2.0
temp_buffers = '8MB'
maintenance_work_mem = '64MB'

# Stock statistics and planner behavior
default_statistics_target = 100
constraint_exclusion = 'partition'
cursor_tuple_fraction = 0.1
recursive_worktable_factor = 10.0
plan_cache_mode = 'auto'
from_collapse_limit = 8
join_collapse_limit = 8

# Normal GEQO policy, explicitly frozen
geqo = on
geqo_threshold = 12
geqo_effort = 5
geqo_pool_size = 0
geqo_generations = 0
geqo_selection_bias = 2.0
geqo_seed = 0.0

# Stock planner cost constants
seq_page_cost = 1.0
random_page_cost = 4.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025
effective_io_concurrency = 1

# Keep every normal plan method available
enable_async_append = on
enable_bitmapscan = on
enable_gathermerge = on
enable_hashagg = on
enable_hashjoin = on
enable_incremental_sort = on
enable_indexonlyscan = on
enable_indexscan = on
enable_material = on
enable_memoize = on
enable_mergejoin = on
enable_nestloop = on
enable_parallel_append = on
enable_parallel_hash = on
enable_partition_pruning = on
enable_partitionwise_aggregate = off
enable_partitionwise_join = off
enable_presorted_aggregate = on
enable_seqscan = on
enable_sort = on
enable_tidscan = on

# Stock parallel-query policy
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
min_parallel_table_scan_size = '8MB'
min_parallel_index_scan_size = '512kB'
parallel_setup_cost = 1000
parallel_tuple_cost = 0.1
parallel_leader_participation = on

# pg_hint_plan can alter artificial plan costs while enforcing a physical plan.
# Since PostgreSQL's JIT decision is cost-based, disabling JIT prevents that
# implementation detail from becoming an unrequested execution-plan change.
jit = off
jit_provider = 'llvmjit'
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# Keep measurement overhead at stock values
track_io_timing = off
track_wal_io_timing = off
synchronize_seqscans = on

# The trusted harness applies its task-relative timeout per execution.
statement_timeout = 0
lock_timeout = 0
idle_in_transaction_session_timeout = 0

# Stable logs and output
timezone = 'UTC'
log_timezone = 'UTC'
log_line_prefix = '%m [%p] '

# Preserve normal durability
fsync = on
full_page_writes = on
synchronous_commit = on

# Connection and credential baseline
max_connections = 100
password_encryption = 'scram-sha-256'
