name: qorl

services:
  postgres:
    image: qorl-postgres:18.6-pg_hint_plan-1.8.0
    platform: linux/amd64
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: qorl
      POSTGRES_USER: qorl_admin
      POSTGRES_PASSWORD: ${QORL_POSTGRES_PASSWORD:?Set QORL_POSTGRES_PASSWORD in .env}
      QORL_RUNNER_PASSWORD: ${QORL_RUNNER_PASSWORD:?Set QORL_RUNNER_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C --data-checksums
      QORL_ASSERT_RUNTIME: "1"
      QORL_EXPECTED_CPUSET: ${QORL_POSTGRES_CPUSET:?Load a PostgreSQL runtime profile}
      QORL_EXPECTED_CPUSET_MEMS: ${QORL_POSTGRES_CPUSET_MEMS:?Load a PostgreSQL runtime profile}
      QORL_EXPECTED_MEMORY_BYTES: ${QORL_POSTGRES_MEMORY_BYTES:?Load a PostgreSQL runtime profile}
      QORL_EXPECTED_MEMORY_SWAP_BYTES: ${QORL_POSTGRES_MEMORY_SWAP_BYTES:?Load a PostgreSQL runtime profile}
      QORL_EXPECTED_SHM_BYTES: ${QORL_POSTGRES_SHM_BYTES:?Load a PostgreSQL runtime profile}
    ports:
      - 127.0.0.1:${QORL_POSTGRES_PORT:?Load a PostgreSQL runtime profile}:5432
    cpuset: ${QORL_POSTGRES_CPUSET:?Load a PostgreSQL runtime profile}
    mem_limit: ${QORL_POSTGRES_MEMORY_LIMIT:?Load a PostgreSQL runtime profile}
    memswap_limit: ${QORL_POSTGRES_MEMORY_SWAP_LIMIT:?Load a PostgreSQL runtime profile}
    shm_size: ${QORL_POSTGRES_SHM_SIZE:?Load a PostgreSQL runtime profile}
    command:
      - postgres
      - -c
      - config_file=/etc/qorl/postgres.conf
    healthcheck:
      test: ["CMD", "/usr/local/bin/qorl-assert-config"]
      interval: 168h
      timeout: 15s
      start_period: 1m
      start_interval: 1s
      retries: 1
    stop_grace_period: 1m
    volumes:
      - qorl-postgres-data:/var/lib/postgresql
      - ${QORL_IMDB_DATA_DIR:-./data/raw/tables}:/qorl/imdb-data:ro
      - ${QORL_IMDB_SOURCE_DIR:-./benchmarks/raw/job/source}:/qorl/imdb-source:ro
      - ${QORL_POSTGRES_CONFIG_FILE:?Select a PostgreSQL config}:/etc/qorl/postgres.conf:ro
      - ${QORL_POSTGRES_EXPECTED_FILE:?Select a PostgreSQL config}:/usr/share/qorl/postgres-config.expected.json:ro
      - ${QORL_POSTGRES_ASSERT_SCRIPT:?Select a PostgreSQL config}:/usr/local/bin/qorl-assert-config:ro
      - ${QORL_POSTGRES_DUMP_SCRIPT:?Select a PostgreSQL config}:/usr/local/bin/qorl-dump-postgres-state:ro

volumes:
  qorl-postgres-data:
