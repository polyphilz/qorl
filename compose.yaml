name: qprl

services:
  postgres:
    image: qprl-postgres:16.15-pg_hint_plan-1.6.2
    platform: linux/amd64
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: qprl
      POSTGRES_USER: qprl_admin
      POSTGRES_PASSWORD: ${QPRL_POSTGRES_PASSWORD:?Set QPRL_POSTGRES_PASSWORD in .env}
      QPRL_AGENT_PASSWORD: ${QPRL_AGENT_PASSWORD:?Set QPRL_AGENT_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C --data-checksums
      QPRL_ASSERT_RUNTIME: "1"
      QPRL_EXPECTED_CPUSET: 8-15,24-31
      QPRL_EXPECTED_CPUSET_MEMS: "0"
      QPRL_EXPECTED_MEMORY_BYTES: "34359738368"
      QPRL_EXPECTED_MEMORY_SWAP_BYTES: "0"
      QPRL_EXPECTED_SHM_BYTES: "1073741824"
    ports:
      - 127.0.0.1:${QPRL_POSTGRES_PORT:-55432}:5432
    cpuset: 8-15,24-31
    mem_limit: 32g
    memswap_limit: 32g
    shm_size: 1g
    stop_grace_period: 1m
    volumes:
      - qprl-postgres-data:/var/lib/postgresql/data

volumes:
  qprl-postgres-data:
